<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <style>
        body {
            background-color: #0B1D3A;
            color: #FFFFF0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        h1 {
            color: #F7E7CE;
            letter-spacing: 1px;
        }
        form {
            background-color: #142B52;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        input {
            padding: 8px;
            margin: 6px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #F7E7CE;
            color: #0B1D3A;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        ul {
            list-style: none;
            padding: 0;
            width: 300px;
        }
        li {
            background-color: #142B52;
            margin: 6px 0;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Expense Tracker</h1>

    <form method="POST">
        <input type="text" name="description" placeholder="Description" required>
        <input type="number" name="amount" placeholder="Amount" step="0.01" required>
        <input type="text" name="category" placeholder="Category" required>
        <button type="submit">Add Expense</button>
    </form>

    <ul>
        {% for expense in expenses %}
            <li>{{ expense.description }} - {{ expense.amount }} ({{ expense.category }})</li>
        {% endfor %}
    </ul>
</body>
</html>
