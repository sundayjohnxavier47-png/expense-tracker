<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <style>
        body {
            background-color: #0B1D3A;
            color: #FFFFF0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        h1 {
            color: #F7E7CE;
            letter-spacing: 1px;
        }
        h2 {
            color: #F7E7CE;
        }
        form {
            background-color: #142B52;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        input {
            padding: 8px;
            margin: 6px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #F7E7CE;
            color: #0B1D3A;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        ul {
            list-style: none;
            padding: 0;
            width: 320px;
        }
        li {
            background-color: #142B52;
            margin: 6px 0;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a {
            color: #F7E7CE;
            text-decoration: none;
            font-size: 0.85em;
            border: 1px solid #F7E7CE;
            padding: 4px 8px;
            border-radius: 4px;
        }
        a:hover {
            background-color: #F7E7CE;
            color: #0B1D3A;
        }
    </style>
</head>
<body>
    <h1>Expense Tracker</h1>

    <form method="POST">
        <input type="text" name="description" placeholder="Description" required>
        <input type="number" name="amount" placeholder="Amount" step="0.01" required>
        <input type="text" name="category" placeholder="Category" required>
        <button type="submit">Add Expense</button>
    </form>

    <h2>Total: {{ total }}</h2>

    <ul>
        {% for expense in expenses %}
            <li>
                <span>{{ expense.description }} - {{ expense.amount }} ({{ expense.category }})</span>
                <a href="{{ url_for('delete', index=loop.index0) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
